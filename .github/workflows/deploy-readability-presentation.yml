name: Deploy GitHub Pages projects

on:
  push:
    branches: [main]
    paths:
      - "readability-presentation/**"
      - ".github/workflows/deploy-readability-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: readability-presentation/package-lock.json
      - name: Install dependencies
        working-directory: readability-presentation
        run: npm ci
      - name: Build readability presentation
        working-directory: readability-presentation
        run: npm run build
      - name: Package project at its own URL
        run: |
          mkdir -p pages/readability-presentation
          cp -R readability-presentation/dist/. pages/readability-presentation/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}readability-presentation/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
