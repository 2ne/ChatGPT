name: Deploy GitHub Pages projects

on:
  push:
    branches: [main]
    paths:
      - "readability-presentation/**"
      - "snip/**"
      - "treadmill-coach/**"
      - "research-agent-orbs/**"
      - ".github/workflows/deploy-readability-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            readability-presentation/package-lock.json
            snip/package-lock.json
            treadmill-coach/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix readability-presentation
          npm ci --prefix snip
          npm ci --prefix treadmill-coach
      - name: Build projects
        run: |
          npm run build --prefix readability-presentation
          npm run build --prefix snip
          npm run build --prefix treadmill-coach
      - name: Package projects at their own URLs
        run: |
          mkdir -p pages/readability-presentation pages/snip pages/treadmill-coach pages/research-agent-orbs
          cp -R readability-presentation/dist/. pages/readability-presentation/
          cp -R snip/dist/. pages/snip/
          cp -R treadmill-coach/dist/. pages/treadmill-coach/
          cp -R research-agent-orbs/. pages/research-agent-orbs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
