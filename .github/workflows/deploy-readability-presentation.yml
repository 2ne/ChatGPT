name: Deploy GitHub Pages projects

on:
  push:
    branches: [main]
    paths:
      - "readability-presentation/**"
      - "snip/**"
      - "treadmill-coach/**"
      - "research-agent-orbs/**"
      - "primary-learn/**"
      - "prototype-to-pilot/**"
      - "sector-null/**"
      - "sector-null-preview/**"
      - ".github/workflows/deploy-readability-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so sector-null can stamp BUILD from git rev-list --count.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            readability-presentation/package-lock.json
            snip/package-lock.json
            treadmill-coach/package-lock.json
            primary-learn/package-lock.json
            prototype-to-pilot/package-lock.json
            sector-null/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix readability-presentation
          npm ci --prefix snip
          npm ci --prefix treadmill-coach
          npm ci --prefix primary-learn
          npm ci --prefix prototype-to-pilot
          npm ci --prefix sector-null
      - name: Build projects
        run: |
          npm run build --prefix readability-presentation
          npm run build --prefix snip
          npm run build --prefix treadmill-coach
          npm run build --prefix primary-learn
          npm run build --prefix prototype-to-pilot
          npm run build --prefix sector-null
      - name: Package projects at their own URLs
        run: |
          mkdir -p pages/readability-presentation pages/snip pages/treadmill-coach pages/research-agent-orbs pages/primary-learn pages/prototype-to-pilot pages/sector-null pages/sector-null-preview
          cp -R readability-presentation/dist/. pages/readability-presentation/
          cp -R snip/dist/. pages/snip/
          cp -R treadmill-coach/dist/. pages/treadmill-coach/
          cp -R research-agent-orbs/. pages/research-agent-orbs/
          cp -R primary-learn/dist/. pages/primary-learn/
          cp -R prototype-to-pilot/dist/. pages/prototype-to-pilot/
          cp -R sector-null/dist/. pages/sector-null/
          # Static preview build of the Defence Bay rework (committed assets; does not replace live sector-null).
          if [ -d sector-null-preview ]; then cp -R sector-null-preview/. pages/sector-null-preview/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
