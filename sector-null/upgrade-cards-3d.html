<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sector Null — 3D Upgrade Icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100dvh;
    font-family: "Rajdhani", "Arial Narrow", sans-serif;
    font-weight: 600;
    color: #d5e7ee;
    background:
      radial-gradient(ellipse at 50% -10%, #102838 0%, transparent 50%),
      radial-gradient(ellipse at 100% 60%, #0c1a14 0%, transparent 40%),
      #060b12;
    padding: 32px 20px 64px;
  }
  .page { width: min(1200px, 100%); margin: 0 auto; }
  header { margin-bottom: 36px; }
  header h1 {
    font-family: "Oxanium", "Rajdhani", sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 0.09em;
    color: #9af5ff;
    text-shadow: 0 0 8px #45ecff99, 0 0 30px #45ecff55;
  }
  header p {
    margin-top: 10px;
    max-width: 64ch;
    font-size: 16px;
    line-height: 1.4;
    color: #9aaeb8;
    letter-spacing: 0.04em;
  }
  header a { color: #45ecff; text-decoration: none; border-bottom: 1px solid #45ecff55; }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 22px 0 8px;
  }
  .filters button {
    appearance: none;
    border: 1px solid #2c4858;
    background: #0a141e;
    color: #c3d2d9;
    font: 700 13px/1 "Rajdhani", sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 8px 12px;
    cursor: pointer;
  }
  .filters button[aria-pressed="true"] {
    border-color: var(--cat, #45ecff);
    color: #07111a;
    background: var(--cat, #45ecff);
  }
  .section { margin-top: 40px; }
  .section.hidden { display: none; }
  .section h2 {
    font-family: "Oxanium", "Rajdhani", sans-serif;
    font-size: 18px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cat, #9af5ff);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: color-mix(in srgb, var(--cat, #45ecff) 35%, transparent);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 22px;
  }
  .upgrade-block {
    margin-bottom: 28px;
  }
  .upgrade-block h3 {
    font-family: "Oxanium", "Rajdhani", sans-serif;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #7a909c;
    margin: 0 0 12px;
  }
  .rank-tag {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: color-mix(in srgb, var(--accent) 70%, #fff);
    margin-top: 6px;
  }
  .trio {
    display: grid;
    grid-template-columns: 1.06fr 1fr 1fr;
    gap: 24px;
    width: min(1120px, 100%);
  }
  .note {
    margin-top: 10px;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #6a8490;
  }
  .req {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #7a909c;
  }

  .card {
    --accent: #64dfee;
    --lift: -10px;
    --zoom: 1.045;
    position: relative;
    isolation: isolate;
    padding: 22px 22px 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #e4f1f5;
    text-align: center;
    border: 0;
    background: none;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 1px;
    z-index: -2;
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
    background:
      radial-gradient(ellipse at 50% 22%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
      linear-gradient(145deg, #0b1623f5, #040e18f5);
  }
  .card-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: -1;
    fill: none;
    stroke: var(--accent);
  }
  .card-frame path { vector-effect: non-scaling-stroke; }
  .frame-edge { stroke-opacity: 0.55; }
  .frame-inner { stroke-opacity: 0.12; }
  .frame-rail { fill: var(--accent); fill-opacity: 0.55; stroke-opacity: 0.8; }
  .recommended .card-frame { filter: drop-shadow(0 0 5px var(--accent)); }
  .recommended .frame-edge { stroke-width: 2; stroke-opacity: 1; }
  .recommended .frame-inner { stroke-opacity: 0.65; }
  .recommended .frame-rail { fill-opacity: 0.9; }
  .ctop {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.07em;
    min-height: 28px;
    color: var(--accent);
  }
  .recommended .ctop > span:first-child {
    padding: 5px 12px;
    color: #07111a;
    background: var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 65%, calc(100% - 9px) 100%, 0 100%);
  }
  .ckey {
    font-family: "Oxanium", sans-serif;
    font-size: 18px;
    padding: 3px 8px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, #263747);
    background: #06101ba8;
    color: #cdd2d8;
  }
  .icon-stage {
    width: 100%;
    height: 200px;
    margin: 0;
    display: block;
    touch-action: none;
    cursor: grab;
    border-radius: 0;
    background: transparent;
    position: relative;
    top: -12px;
    z-index: 0;
  }
  .icon-stage:active { cursor: grabbing; }
  .cname {
    position: relative;
    z-index: 1;
    margin-top: -56px;
    font-family: "Rajdhani", sans-serif;
    font-size: clamp(24px, 2.3vw, 32px);
    letter-spacing: 0.025em;
    line-height: 1.1;
    text-shadow:
      0 2px 0 #000,
      0 0 12px #040e18,
      0 0 4px #040e18;
  }
  .cdesc {
    font-size: 18px;
    color: #c3d2d9;
    line-height: 1.25;
    min-height: 46px;
    margin: 8px 0 18px;
  }
  .cstat {
    width: 100%;
    margin-top: auto;
    padding: 10px 4px;
    border-top: 1px solid #9ac5d033;
    border-bottom: 1px solid #9ac5d033;
    background: linear-gradient(100deg, #34566633, #09172388, #34566633);
    clip-path: polygon(12px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 8px 100%, 0 calc(100% - 8px), 0 12px);
    font-size: 17px;
    color: #d5e5ee;
  }
  .cstat b { font-weight: 700; color: var(--accent); }
  .clvl { display: flex; gap: 6px; margin-top: 18px; height: 10px; }
  .clvl i {
    width: 28px;
    max-width: 5vw;
    height: 8px;
    background: #24262c;
    border: 1px solid #ffffff18;
    transform: skewX(-16deg);
  }
  .clvl i.next {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  @media (hover: hover) and (pointer: fine) {
    .card { transition: transform 0.18s ease-out; }
    .card:hover {
      transform: translateY(var(--lift)) scale(var(--zoom));
      z-index: 2;
    }
    .card:hover .card-frame {
      filter: drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 16px var(--accent));
    }
    .card:hover .frame-edge { stroke-opacity: 1; stroke-width: 2.5; }
  }
  @media (max-width: 720px) {
    .trio { grid-template-columns: 1fr; }
    .icon-stage { height: 170px; }
    .cname { margin-top: -48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>3D UPGRADE ICONS</h1>
      <p>
        Every upgrade at every offer rank, with Three.js icon dioramas — drag any stage to orbit.
        Flat reference: <a href="./upgrade-cards.html">upgrade-cards.html</a>
      </p>
      <div class="filters" id="filters" role="toolbar" aria-label="Filter by category"></div>
    </header>

    <section class="section" data-section="sample">
      <h2 style="--cat:#9af5ff">Sample picker layout</h2>
      <div class="trio" id="trio"></div>
      <p class="note">Drag icons · recommended · alternative · ability</p>
    </section>

    <div id="catalog"></div>
  </div>

<script>
(() => {
  const CATS = {
    engineer: '#a7a1ff',
    firepower: '#ffad61',
    handling:  '#76bcf0',
    survival:  '#70dfb8',
    fortune:   '#bdadfa',
    ability:   '#7cff4a',
  };
  const ORDER = ['engineer', 'firepower', 'handling', 'survival', 'fortune', 'ability'];
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

  const helperDamage = rank => 0.8 + rank * 0.7;

  // Each entry expands to one card per offer rank (owned = 0 .. max-1).
  const UPGRADES = [
    {
      id: 'bot', cat: 'engineer', max: 3, requires: null,
      tier(owned) {
        const next = owned + 1;
        return {
          name: owned ? 'UPGRADE HELPER BOT' : 'HELPER BOT',
          desc: owned ? 'Stronger companion shots' : 'Deploy one automatic companion',
          now: owned ? helperDamage(owned).toFixed(1) : 'Shot damage',
          after: `${helperDamage(next).toFixed(1)} damage`,
        };
      },
    },
    {
      id: 'botGun', cat: 'engineer', max: 2, requires: 'Helper Bot owned · no Bomb Launcher',
      tier(owned) {
        return {
          name: 'TWIN GUNS',
          desc: 'Double bot fire • locks out bombs',
          now: owned ? 'Twin' : 'Single',
          after: owned ? 'Rapid twin' : 'Twin guns',
        };
      },
    },
    {
      id: 'botBomb', cat: 'engineer', max: 2, requires: 'Helper Bot owned · no Twin Guns',
      tier(owned) {
        return {
          name: 'BOMB LAUNCHER',
          desc: 'Area blasts • locks out twin guns',
          now: '1 shot / 1.7s',
          after: owned ? 'Wider bombs' : 'Area bombs',
        };
      },
    },
    {
      id: 'mine', cat: 'engineer', max: 3, requires: null,
      tier(owned) {
        return {
          name: 'TRAIL MINES',
          desc: 'One trap every 8s • max 3 active',
          now: 'Blast damage',
          after: `${4 + owned}`,
        };
      },
    },
    {
      id: 'shock', cat: 'engineer', max: 1, requires: 'Trail Mines owned',
      tier() {
        return {
          name: 'SHOCK MINES',
          desc: 'Mine blasts slow survivors for 3s',
          now: 'Explosive',
          after: '+60% slow',
        };
      },
    },
    {
      id: 'damage', cat: 'firepower', max: 6, requires: null,
      tier(owned) {
        const dmg = 1 + owned * 0.5;
        return {
          name: 'PULSE AMPLIFIER',
          desc: '+50% pulse damage',
          now: `${dmg}×`,
          after: `${dmg + 0.5}×`,
        };
      },
    },
    {
      id: 'rate', cat: 'firepower', max: 4, requires: null,
      tier(owned) {
        let fireRate = 0.13;
        for (let i = 0; i < owned; i++) fireRate *= 0.8;
        return {
          name: 'RAPID CYCLER',
          desc: 'fire 20% faster',
          now: (1 / fireRate).toFixed(1),
          after: `${(1 / (fireRate * 0.8)).toFixed(1)}/s`,
        };
      },
    },
    {
      id: 'pierce', cat: 'firepower', max: 3, requires: null,
      tier(owned) {
        return {
          name: 'PIERCING',
          desc: 'shots pierce +1 drone',
          now: `${owned}`,
          after: `${owned + 1} thru`,
        };
      },
    },
    {
      id: 'spread', cat: 'firepower', max: 3, requires: null,
      tier(owned) {
        return {
          name: 'SPLIT BEAM',
          desc: '+1 pulse per shot',
          now: `${1 + owned}`,
          after: `${2 + owned} per shot`,
        };
      },
    },
    {
      id: 'mag', cat: 'handling', max: 5, requires: null,
      tier(owned) {
        const size = 8 + owned * 4;
        return {
          name: 'CELL CAPACITY',
          desc: '+4 pulses per cell',
          now: `${size}`,
          after: `${size + 4} pulses`,
        };
      },
    },
    {
      id: 'reload', cat: 'handling', max: 4, requires: null,
      tier(owned) {
        let reload = 1.2;
        for (let i = 0; i < owned; i++) reload *= 0.75;
        return {
          name: 'HOT SWAP',
          desc: 'reload 25% faster',
          now: reload.toFixed(2),
          after: `${(reload * 0.75).toFixed(2)}s`,
        };
      },
    },
    {
      id: 'regen', cat: 'survival', max: 2, requires: null,
      tier(owned) {
        return {
          name: 'SHIELD REGEN',
          desc: 'Recover 1 shield after avoiding hits',
          now: 'No damage for',
          after: owned ? '8 seconds' : '12 seconds',
        };
      },
    },
    {
      id: 'pulse', cat: 'survival', max: 3, requires: null,
      tier(owned) {
        return {
          name: 'EMERGENCY PULSE',
          desc: 'Shield loss blasts enemies',
          now: `${owned}`,
          after: `Rank ${owned + 1}`,
        };
      },
    },
    {
      id: 'hp', cat: 'survival', max: 3, requires: null,
      tier(owned) {
        const maxHp = 3 + owned;
        return {
          name: 'SHIELD ARRAY',
          desc: '+1 shield and recharge it',
          now: `${maxHp}`,
          after: `${maxHp + 1} max hp`,
        };
      },
    },
    {
      id: 'speed', cat: 'survival', max: 3, requires: null,
      tier(owned) {
        let speed = 6.2;
        for (let i = 0; i < owned; i++) speed *= 1.12;
        return {
          name: 'MOTION SERVO',
          desc: 'move 12% faster',
          now: `${Math.round(speed / 6.2 * 100)}%`,
          after: `${Math.round(speed * 1.12 / 6.2 * 100)}%`,
        };
      },
    },
    {
      id: 'heal', cat: 'survival', max: 1, infinite: true, requires: 'Injured (hp < max)',
      tier() {
        return {
          name: 'SHIELD RESET',
          desc: 'restore all shield segments',
          now: '2',
          after: '3 hp',
        };
      },
    },
    {
      id: 'luck', cat: 'fortune', max: 3, requires: null,
      tier(owned) {
        const chance = (0.05 + owned * 0.03) * 100;
        return {
          name: 'SALVAGE SCANNER',
          desc: 'More Overcharge / Infinite Cell drops',
          now: `${chance.toFixed(1)}%`,
          after: `${(chance + 3).toFixed(1)}% drops`,
        };
      },
    },
    {
      id: 'magnet', cat: 'ability', max: 1, requires: null,
      tier() {
        return {
          name: 'MAGNETIC GEMS',
          desc: 'Gems surge toward you',
          now: 'Short pull',
          after: 'Through walls',
        };
      },
    },
  ];

  function expandTiers(u) {
    const count = u.infinite ? 1 : u.max;
    return Array.from({ length: count }, (_, owned) => {
      const t = u.tier(owned);
      return {
        ...u,
        ...t,
        owned,
        rankLabel: u.infinite ? 'Anytime' : `Offer ${owned + 1} / ${u.max}`,
      };
    });
  }

  const ALL_CARDS = UPGRADES.flatMap(expandTiers);

  const FRAME =
    '<svg class="card-frame" viewBox="0 0 320 360" preserveAspectRatio="none" aria-hidden="true">' +
    '<path class="frame-edge" d="M16 1H304L319 16V344L304 359H16L1 344V16Z"/>' +
    '<path class="frame-inner" d="M18 6H302L314 18V342L302 354H18L6 342V18Z"/>' +
    '<path class="frame-rail" d="M16 1H304L313 10H150L145 14H4Z"/></svg>';

  function hex(c) { return new THREE.Color(c); }

  function std(color, opts = {}) {
    return new THREE.MeshStandardMaterial({
      color, roughness: 0.42, metalness: 0.45, ...opts,
    });
  }

  function glow(color, intensity = 1.2) {
    return new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: intensity,
      roughness: 0.25, metalness: 0.15,
    });
  }

  function addBox(parent, mat, w, h, d, x = 0, y = 0, z = 0) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    parent.add(m);
    return m;
  }

  function addShadowGround(root) {
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(4.5, 4.5),
      new THREE.ShadowMaterial({ opacity: 0.28 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    root.add(ground);
    return ground;
  }

  function enableCast(root) {
    root.traverse(obj => {
      if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = false;
      }
    });
  }

  function helperBot(variant = 'base', owned = 0) {
    const g = new THREE.Group();
    const next = owned + 1;
    const shell = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 24), std(0xffffff, {
      metalness: 0.08, roughness: 0.22, emissive: 0xdfe8f0, emissiveIntensity: 0.18 + next * 0.06,
    }));
    g.add(shell);
    const socket = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), std(0x172733, { metalness: 0.55, roughness: 0.35 }));
    socket.position.z = 0.48;
    g.add(socket);
    const alloy = std(0x506375, { metalness: 0.65, roughness: 0.3 });
    if (variant === 'twin') {
      [-0.12, 0.12].forEach(x => {
        addBox(g, alloy, 0.1, 0.1, 0.48 + owned * 0.06, x, 0, 0.72);
      });
      const flash = new THREE.Mesh(new THREE.SphereGeometry(0.07 + owned * 0.02, 10, 8), glow(0xa7a1ff, 1.6 + owned));
      flash.position.set(0, 0, 0.98 + owned * 0.04);
      g.add(flash);
      g.userData.pulse = flash;
      g.userData.rapid = owned >= 1;
    } else if (variant === 'bomb') {
      const size = 0.16 + owned * 0.08;
      addBox(g, alloy, 0.22 + owned * 0.06, 0.22 + owned * 0.06, 0.34, 0, 0, 0.7);
      const bomb = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 12), glow(0xffad61, 1.1 + owned * 0.4));
      bomb.position.set(0, 0, 1.0);
      g.add(bomb);
      g.userData.pulse = bomb;
    } else {
      addBox(g, alloy, 0.12, 0.12, 0.42, 0, 0, 0.72);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.06 + next * 0.015, 10, 8), glow(0x76bcf0, 1.2 + next * 0.35));
      tip.position.set(0, 0, 0.96);
      g.add(tip);
      g.userData.pulse = tip;
    }
    g.scale.setScalar(0.92 + next * 0.06);
    return g;
  }

  function mineBody(shock = false, owned = 0) {
    const g = new THREE.Group();
    const accent = shock ? 0x70dfb8 : 0xa7a1ff;
    const next = owned + 1;
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.38 + next * 0.04, 0.5 + next * 0.05, 0.22, 8),
      glow(accent, shock ? 1.3 : 0.55 + next * 0.2)
    );
    g.add(body);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.1, 8), std(0x1a2230, { metalness: 0.7 }));
    cap.position.y = 0.14;
    g.add(cap);
    for (let i = 0; i < 4; i++) {
      const fin = addBox(g, std(0x2a3344), 0.08, 0.06, 0.55, 0, 0.02, 0);
      fin.rotation.y = (i / 4) * Math.PI * 2;
      fin.position.set(Math.sin(fin.rotation.y) * 0.35, 0.02, Math.cos(fin.rotation.y) * 0.35);
    }
    if (shock) {
      const arcs = new THREE.Group();
      for (let i = 0; i < 3; i++) {
        const arc = new THREE.Mesh(
          new THREE.TorusGeometry(0.55 + i * 0.12, 0.018, 6, 24, Math.PI * 1.2),
          glow(0x9af5ff, 2)
        );
        arc.rotation.set(0.4 + i * 0.3, i * 1.1, i * 0.5);
        arcs.add(arc);
      }
      g.add(arcs);
      g.userData.arcs = arcs;
    }
    const spike = addBox(g, std(0xd8dee8, { metalness: 0.8 }), 0.06, 0.45, 0.06, 0, 0.35, 0);
    g.userData.spike = spike;
    return g;
  }

  function rifleBase() {
    const g = new THREE.Group();
    const body = std(0x536d7e);
    const metal = std(0x8aa0b0, { metalness: 0.75, roughness: 0.28 });
    addBox(g, body, 0.22, 0.28, 0.55, 0, 0, -0.15);
    addBox(g, metal, 0.16, 0.18, 0.7, 0, 0.04, 0.35);
    addBox(g, metal, 0.1, 0.1, 0.55, 0, 0.05, 0.9);
    addBox(g, body, 0.18, 0.16, 0.32, 0, -0.05, 0.55);
    const grip = addBox(g, body, 0.14, 0.32, 0.16, 0, -0.22, 0.05);
    grip.rotation.x = 0.35;
    return g;
  }

  // Same basis as game.js tracers: lookAt aims local -Z forward, streak sits on -Z.
  const _aimFwd = new THREE.Vector3(0, 0, -1);
  const _tmpDir = new THREE.Vector3();
  const _tmpPos = new THREE.Vector3();

  function makeTracer() {
    const g = new THREE.Group();
    const core = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshBasicMaterial({
        color: 0xe1fcff, transparent: true, opacity: 1,
        blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
      })
    );
    core.scale.set(0.05, 0.05, 0.9);
    core.position.z = -0.35;
    const aura = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshBasicMaterial({
        color: 0x62edff, transparent: true, opacity: 0.45,
        blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
      })
    );
    aura.scale.set(0.15, 0.15, 1.05);
    aura.position.z = -0.42;
    g.add(aura, core);
    g.userData.aura = aura;
    return g;
  }

  function shieldPlate(color, scale = 1) {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0.9);
    shape.lineTo(0.62, 0.55);
    shape.lineTo(0.55, -0.35);
    shape.quadraticCurveTo(0, -0.85, -0.55, -0.35);
    shape.lineTo(-0.62, 0.55);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 2 });
    geo.center();
    const mesh = new THREE.Mesh(geo, std(color, {
      metalness: 0.55, roughness: 0.25,
      emissive: hex(color), emissiveIntensity: 0.35,
      transparent: true, opacity: 0.92,
    }));
    mesh.scale.setScalar(scale);
    return mesh;
  }

  function gemCrystal(color = 0x7cff4a, s = 1) {
    const mesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.28, 0).scale(0.72, 1.25, 0.72),
      new THREE.MeshPhysicalMaterial({
        color, emissive: color, emissiveIntensity: 0.55,
        metalness: 0.15, roughness: 0.12, transmission: 0.35,
        thickness: 0.4, transparent: true, opacity: 0.95,
      })
    );
    mesh.scale.multiplyScalar(s);
    return mesh;
  }

  const builders = {
    bot: (owned = 0) => helperBot('base', owned),
    botGun: (owned = 0) => helperBot('twin', owned),
    botBomb: (owned = 0) => helperBot('bomb', owned),
    mine: (owned = 0) => mineBody(false, owned),
    shock: () => mineBody(true, 0),
    damage(owned = 0) {
      const g = rifleBase();
      const next = owned + 1;
      const amp = new THREE.Mesh(new THREE.SphereGeometry(0.18 + next * 0.035, 16, 12), glow(0xffad61, 1.4 + next * 0.2));
      amp.position.set(0, 0.08, 1.15);
      g.add(amp);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.26 + next * 0.03, 0.035, 8, 24), glow(0xffad61, 1.2));
      ring.position.copy(amp.position);
      ring.rotation.y = Math.PI / 2;
      g.add(ring);
      g.userData.pulse = amp;
      g.userData.ring = ring;
      return g;
    },
    rate(owned = 0) {
      const g = rifleBase();
      const rotor = new THREE.Group();
      rotor.position.set(0, 0.05, 0.95);
      for (let i = 0; i < 4; i++) {
        const barrel = addBox(rotor, std(0x9ab0c0, { metalness: 0.8 }), 0.09, 0.09, 0.55, 0, 0.16, 0.1);
        barrel.rotation.z = (i / 4) * Math.PI * 2;
        barrel.position.set(Math.sin(barrel.rotation.z) * 0.16, Math.cos(barrel.rotation.z) * 0.16, 0.1);
      }
      g.add(rotor);
      g.userData.rotor = rotor;
      g.userData.rotorSpeed = 5 + owned * 3;
      return g;
    },
    pierce(owned = 0) {
      const g = new THREE.Group();
      const plateColors = [0x334455, 0x3a4d60, 0x455868, 0x506375];
      const plates = [];
      for (let i = 0; i <= owned; i++) {
        plates.push(addBox(g, std(plateColors[i] || 0x506375), 0.08, 0.7, 0.55, -0.45 + i * 0.35, 0, 0.05 + i * 0.12));
      }
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.12, 1.5 + owned * 0.15, 6), glow(0xffad61, 1.5));
      spike.rotation.z = -Math.PI / 2;
      spike.position.set(0.05, 0, 0.2);
      g.add(spike);
      g.userData.spike = spike;
      g.userData.plates = plates;
      return g;
    },
    spread(owned = 0) {
      // Mirror fire(): every pulse starts on the muzzle, then fans with (k-mid)*0.13.
      // AFTER volley counts: owned 0/1/2 → 2/3/4 pulses.
      const g = rifleBase();
      const muzzle = new THREE.Object3D();
      muzzle.position.set(0, 0.05, 1.18);
      g.add(muzzle);
      const flash = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 10, 8),
        new THREE.MeshBasicMaterial({
          color: 0xe1fcff, transparent: true, opacity: 0,
          blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
        })
      );
      muzzle.add(flash);
      const count = 2 + owned;
      const beams = [];
      for (let k = 0; k < count; k++) {
        const a = (k - (count - 1) / 2) * 0.13;
        // fire() with aim +Z → dir = (-sin(a), 0, cos(a)) in gun space.
        const dir = new THREE.Vector3(-Math.sin(a), 0, Math.cos(a));
        const beam = makeTracer();
        g.add(beam);
        beams.push({ mesh: beam, dir });
      }
      g.userData.split = { muzzle, flash, beams, cycle: 0 };
      return g;
    },
    mag(owned = 0) {
      const g = new THREE.Group();
      addBox(g, std(0x2a3d4c, { metalness: 0.6 }), 0.55, 0.95, 0.35);
      const lit = Math.min(5, owned + 1);
      for (let i = 0; i < 5; i++) {
        const on = i < lit;
        addBox(
          g,
          on ? glow(0x76bcf0, 0.9 + i * 0.15) : std(0x1a2430),
          0.42, 0.09, 0.08, 0, -0.32 + i * 0.18, 0.2
        );
      }
      addBox(g, std(0x8aa0b0, { metalness: 0.8 }), 0.58, 0.1, 0.38, 0, 0.52, 0);
      return g;
    },
    reload() {
      const g = new THREE.Group();
      const cradle = addBox(g, std(0x314455), 0.9, 0.18, 0.45, 0, -0.35, 0);
      const cellA = addBox(g, glow(0x76bcf0, 1), 0.32, 0.55, 0.22, -0.28, 0.05, 0);
      const cellB = addBox(g, std(0x1c2a36), 0.32, 0.55, 0.22, 0.35, 0.35, 0);
      cellB.rotation.z = 0.5;
      g.userData.swap = { cellA, cellB, cradle };
      return g;
    },
    regen() {
      const g = new THREE.Group();
      const shield = shieldPlate(0x70dfb8, 0.95);
      g.add(shield);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.04, 8, 40), glow(0x70dfb8, 1.4));
      ring.rotation.x = Math.PI / 2;
      g.add(ring);
      g.userData.ring = ring;
      g.userData.shield = shield;
      return g;
    },
    pulse(owned = 0) {
      const g = new THREE.Group();
      g.add(shieldPlate(0x70dfb8, 0.85));
      const count = owned + 1;
      const waves = Array.from({ length: count }, (_, i) => {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.65 + i * 0.28, 0.03, 6, 40),
          new THREE.MeshBasicMaterial({ color: 0x9af5ff, transparent: true, opacity: 0.55 - i * 0.12 })
        );
        ring.rotation.x = Math.PI / 2;
        g.add(ring);
        return ring;
      });
      g.userData.waves = waves;
      return g;
    },
    hp(owned = 0) {
      const g = new THREE.Group();
      const layers = Math.min(4, owned + 2);
      for (let i = 0; i < layers; i++) {
        const p = shieldPlate(i === layers - 1 ? 0x9af5ff : 0x70dfb8, 0.8 - i * 0.04);
        p.position.z = -0.22 + i * 0.18;
        p.position.x = i * 0.06;
        g.add(p);
      }
      return g;
    },
    speed(owned = 0) {
      const g = new THREE.Group();
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.35, 12), std(0x3a5162, { metalness: 0.7 }));
      hub.rotation.z = Math.PI / 2;
      g.add(hub);
      const jets = [-0.28, 0.28].map(y => {
        const jet = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.55, 10), glow(0x70dfb8, 1.6));
        jet.rotation.z = Math.PI / 2;
        jet.position.set(-0.45, y, 0);
        g.add(jet);
        return jet;
      });
      const flame = new THREE.Mesh(new THREE.ConeGeometry(0.18 + owned * 0.04, 0.65 + owned * 0.12, 10), glow(0x9af5ff, 2));
      flame.rotation.z = -Math.PI / 2;
      flame.position.set(0.55, 0, 0);
      g.add(flame);
      g.userData.jets = jets;
      g.userData.flame = flame;
      return g;
    },
    heal() {
      const g = new THREE.Group();
      const shield = shieldPlate(0xff708c, 0.9);
      g.add(shield);
      const plus = new THREE.Group();
      addBox(plus, glow(0xffb0c4, 1.8), 0.16, 0.55, 0.12);
      addBox(plus, glow(0xffb0c4, 1.8), 0.55, 0.16, 0.12);
      plus.position.z = 0.2;
      g.add(plus);
      g.userData.plus = plus;
      return g;
    },
    luck(owned = 0) {
      // Glass fortune cells with a solid 3D lightning bolt inside.
      // Ranks show 1 / 2 / 3 cylinders (owned 0/1/2) — kept spaced apart.
      const g = new THREE.Group();
      const count = owned + 1;
      const metal = std(0xd8dee8, { metalness: 0.9, roughness: 0.18 });
      const slots = [
        { x: 0, y: 0.08, z: 0, rz: 0.12 },
        { x: 0.58, y: 0.02, z: 0.1, rz: -0.28 },
        { x: -0.58, y: 0.04, z: 0.08, rz: 0.32 },
      ];

      function powerDots() {
        // Tiny additive dots — always visible through the glass, no vanish on spin.
        const charge = new THREE.Group();
        const specs = [
          [0, 0.02, 0, 0.028],
          [0.07, 0.12, 0.04, 0.018],
          [-0.06, 0.1, -0.03, 0.016],
          [0.05, -0.1, -0.04, 0.02],
          [-0.07, -0.12, 0.03, 0.015],
          [0.02, 0.18, -0.02, 0.014],
          [-0.03, -0.18, 0.02, 0.014],
          [0.08, 0, -0.05, 0.013],
          [-0.08, 0.02, 0.05, 0.013],
          [0.04, 0.06, -0.06, 0.011],
          [-0.05, -0.05, 0.06, 0.011],
          [0.01, -0.14, -0.05, 0.01],
          [-0.02, 0.15, 0.05, 0.01],
          // Extra fill so the cell reads denser / more fizzy.
          [0.06, 0.2, 0.02, 0.012],
          [-0.04, 0.22, -0.04, 0.011],
          [0.09, 0.08, 0.01, 0.012],
          [-0.09, 0.14, 0.02, 0.01],
          [0.03, -0.02, 0.07, 0.013],
          [-0.01, 0.05, -0.08, 0.012],
          [0.1, -0.08, 0.03, 0.011],
          [-0.1, -0.06, -0.02, 0.012],
          [0.06, -0.2, 0.04, 0.011],
          [-0.05, -0.22, -0.03, 0.01],
          [0.0, 0.09, 0.06, 0.012],
          [0.0, -0.08, -0.06, 0.011],
          [0.05, 0.0, 0.0, 0.01],
          [-0.04, 0.0, 0.0, 0.01],
          [0.02, 0.25, 0.0, 0.009],
          [-0.02, -0.25, 0.0, 0.009],
          [0.07, -0.15, -0.05, 0.01],
          [-0.08, 0.18, 0.04, 0.01],
        ];
        // Match drop tints: Infinite Cell blue, Overcharge orange, +1 Shield pink.
        const fizzColors = [0x76bcf0, 0xffa64c, 0xff78b5];
        const dots = specs.map(([x, y, z, r], i) => {
          const mat = new THREE.MeshBasicMaterial({
            color: fizzColors[i % 3],
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: false,
            toneMapped: false,
          });
          const dot = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), mat);
          dot.position.set(x, y, z);
          dot.userData.phase = i * 0.7;
          dot.userData.base = r;
          charge.add(dot);
          return dot;
        });
        charge.userData.dots = dots;
        return charge;
      }

      function powerCell() {
        const cell = new THREE.Group();
        const glass = new THREE.MeshPhysicalMaterial({
          color: 0xc8b8ff,
          emissive: 0xbdadfa,
          emissiveIntensity: 0.3,
          metalness: 0.05,
          roughness: 0.08,
          transmission: 0.55,
          thickness: 0.35,
          transparent: true,
          opacity: 0.5,
          clearcoat: 1,
          clearcoatRoughness: 0.05,
          ior: 1.45,
          side: THREE.DoubleSide,
        });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.58, 28), glass);
        const capGeo = new THREE.CylinderGeometry(0.235, 0.235, 0.1, 28);
        const top = new THREE.Mesh(capGeo, metal);
        top.position.y = 0.34;
        const bot = new THREE.Mesh(capGeo, metal);
        bot.position.y = -0.34;
        const charge = powerDots();
        // Dots after glass so additive sprites stay readable.
        cell.add(body, top, bot, charge);
        cell.userData.charge = charge;
        return cell;
      }

      const cells = [];
      for (let i = 0; i < count; i++) {
        const cell = powerCell();
        const S = slots[i];
        cell.position.set(S.x, S.y, S.z);
        cell.rotation.z = S.rz;
        cell.userData.phase = i * 1.3;
        cell.userData.baseY = S.y;
        g.add(cell);
        cells.push(cell);
      }
      g.userData.cells = cells;
      return g;
    },
    magnet() {
      const g = new THREE.Group();
      const gems = [
        [0, 0.35, 0, 1],
        [-0.7, 0.05, 0.2, 0.62],
        [0.7, 0.05, 0.2, 0.62],
      ].map(([x, y, z, s]) => {
        const gem = gemCrystal(0x7cff4a, s);
        gem.position.set(x, y, z);
        g.add(gem);
        return gem;
      });
      g.userData.gems = gems;
      return g;
    },
  };

  // Full orbit hides the face of these icons — sway ±20° instead.
  const SWAY_IDS = new Set(['bot', 'botGun', 'botBomb', 'magnet', 'luck']);
  const SWAY_ANGLE = 20 * Math.PI / 180;

  function animateIcon(entry, t, dt, hot) {
    const { root, id } = entry;
    const subject = root.userData.subject;
    if (!subject) return;
    const idle = reducedMotion.matches ? 0 : 1;
    const spin = entry.dragging ? 0 : (0.35 + (hot ? 0.55 : 0)) * idle;

    if (!entry.dragging) {
      if (SWAY_IDS.has(id) && idle) {
        entry.yaw = entry.baseYaw + Math.sin(t * 1.15 + entry.phase) * SWAY_ANGLE;
      } else if (!SWAY_IDS.has(id)) {
        entry.yaw += spin * dt;
      }
    }

    root.rotation.y = entry.yaw;
    subject.position.y = idle ? Math.sin(t * 1.6 + entry.phase) * 0.06 : 0;

    const ud = subject.userData;
    if (ud.pulse) ud.pulse.scale.setScalar(1 + 0.12 * Math.sin(t * 6));
    if (ud.rotor) ud.rotor.rotation.z += dt * (hot ? (ud.rotorSpeed || 5) * 1.8 : (ud.rotorSpeed || 5)) * idle;
    if (ud.ring) ud.ring.rotation.z += dt * 1.5 * idle;
    if (ud.arcs) ud.arcs.rotation.y += dt * 2.2 * idle;
    if (ud.waves) {
      ud.waves.forEach((w, i) => {
        const u = (t * 0.9 + i * 0.25) % 1;
        w.scale.setScalar(0.7 + u * 0.9);
        w.material.opacity = (1 - u) * 0.5;
      });
    }
    if (ud.split) {
      const period = 0.55;
      const travel = 3.4;
      ud.split.cycle = (ud.split.cycle + dt) % period;
      const u = ud.split.cycle / period;
      ud.split.flash.material.opacity = u < 0.12 ? (1 - u / 0.12) * 0.9 : 0;
      ud.split.flash.scale.setScalar(0.8 + u * 1.2);
      // Gun-local muzzle; beams parented to the rifle so spin carries them.
      const mz = ud.split.muzzle.position;
      ud.split.beams.forEach(b => {
        const dist = u * travel;
        const fade = u < 0.78 ? 1 : 1 - (u - 0.78) / 0.22;
        // Same path as spawnPulse + bullet step: origin on muzzle, fly along fan dir.
        b.mesh.position.copy(b.dir).multiplyScalar(dist).add(mz);
        // Same orientation as game lookAt(pos + dir): local -Z faces travel.
        b.mesh.quaternion.setFromUnitVectors(_aimFwd, _tmpDir.copy(b.dir));
        b.mesh.visible = fade > 0.02;
        if (b.mesh.userData.aura) b.mesh.userData.aura.material.opacity = 0.45 * fade;
      });
    }
    if (ud.spike && id === 'pierce') {
      ud.spike.position.x = -0.35 + ((t * 0.7) % 1) * 1.1 * idle;
    }
    if (ud.flame) ud.flame.scale.set(1, 1, 0.85 + 0.25 * Math.sin(t * 12));
    if (ud.jets) ud.jets.forEach((j, i) => j.scale.setScalar(0.9 + 0.15 * Math.sin(t * 9 + i)));
    if (ud.cells) {
      ud.cells.forEach(c => {
        c.position.y = c.userData.baseY + Math.sin(t * 1.6 + c.userData.phase) * 0.05 * idle;
        const dots = c.userData.charge?.userData?.dots;
        if (!dots) return;
        dots.forEach(d => {
          const wave = 0.55 + 0.45 * Math.sin(t * 4.5 + d.userData.phase);
          d.scale.setScalar(0.65 + wave * 0.7);
          d.material.opacity = 0.4 + wave * 0.6;
        });
      });
    }
    if (ud.gems) {
      ud.gems.forEach((gem, i) => {
        gem.rotation.y += dt * (1.2 + i * 0.3);
        gem.rotation.x = 0.25 + Math.sin(t * 1.8 + i) * 0.15;
        const pull = 0.55 + 0.35 * Math.sin(t * 2 + i);
        if (i > 0) {
          const side = i === 1 ? -1 : 1;
          gem.position.x = side * (0.35 + pull * 0.45);
          gem.position.y = 0.05 + (1 - pull) * 0.25;
        } else {
          gem.position.y = 0.25 + Math.sin(t * 2.4) * 0.08;
        }
      });
    }
    if (ud.swap) {
      const u = (Math.sin(t * 1.5) + 1) * 0.5;
      ud.swap.cellA.position.y = 0.05 + u * 0.25;
      ud.swap.cellB.position.y = 0.35 - u * 0.25;
      ud.swap.cellB.rotation.z = 0.5 - u * 0.5;
    }
  }

  function makeScene(upgrade) {
    const scene = new THREE.Scene();
    const root = new THREE.Group();
    scene.add(root);
    addShadowGround(root);

    const key = new THREE.DirectionalLight(0xffffff, 1.7);
    // Mostly overhead so the cast sits under the icon, not off to one side.
    key.position.set(0.15, 5.5, 0.35);
    key.target.position.set(0, 0, 0);
    scene.add(key.target);
    key.castShadow = true;
    key.shadow.mapSize.set(256, 256);
    key.shadow.radius = 6;
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 14;
    key.shadow.camera.left = -2.2;
    key.shadow.camera.right = 2.2;
    key.shadow.camera.top = 2.2;
    key.shadow.camera.bottom = -2.2;
    key.shadow.bias = -0.003;
    key.shadow.normalBias = 0.02;
    scene.add(key);
    scene.add(new THREE.AmbientLight(0x8aa4b8, 0.75));
    const rim = new THREE.PointLight(hex(CATS[upgrade.cat]), 2.0, 9);
    rim.position.set(-1.4, 1.2, -1.2);
    scene.add(rim);
    const fill = new THREE.PointLight(0x9af5ff, 0.65, 7);
    fill.position.set(1.2, 0.4, 1.8);
    scene.add(fill);

    const owned = upgrade.owned || 0;
    const subject = (builders[upgrade.id] || builders.bot)(owned);
    subject.position.y = 0.08;
    subject.scale.multiplyScalar(0.64);
    if (upgrade.cat === 'firepower' || upgrade.cat === 'handling') subject.rotation.y = -0.55;
    enableCast(subject);
    root.add(subject);
    root.userData.subject = subject;

    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 40);
    camera.position.set(0, 1.05, 4.35);
    camera.lookAt(0, 0.05, 0);

    return { scene, camera, root };
  }

  function cardHtml(u, { recommended = false, key = '' } = {}) {
    const owned = u.owned || 0;
    const pips = u.infinite ? '' :
      Array.from({ length: u.max }, (_, k) =>
        `<i class="${k < owned ? 'own' : k === owned ? 'next' : ''}"></i>`
      ).join('');
    const top = recommended ? 'RECOMMENDED' : u.cat.toUpperCase();
    const keyHtml = key ? `<span class="ckey">${key}</span>` : '';
    return (
      `<article class="card${recommended ? ' recommended' : ''}" data-id="${u.id}" data-owned="${owned}" style="--accent:${CATS[u.cat]}">` +
      FRAME +
      `<div class="ctop"><span>${top}</span>${keyHtml}</div>` +
      `<canvas class="icon-stage" width="512" height="320" aria-label="${u.name} rank ${owned + 1} 3D icon"></canvas>` +
      `<div class="cname">${u.name}</div><div class="cdesc">${u.desc}</div>` +
      `<div class="cstat">${u.now} → <b>${u.after}</b></div>` +
      (pips ? `<div class="clvl" aria-hidden="true">${pips}</div>` : '') +
      `<p class="rank-tag">${u.rankLabel || ''}</p>` +
      (u.requires ? `<p class="req">${u.requires}</p>` : '') +
      `</article>`
    );
  }

  // —— DOM ——
  const filters = document.getElementById('filters');
  const catalog = document.getElementById('catalog');
  let active = 'all';

  filters.innerHTML = [
    ['all', 'All', '#9af5ff'],
    ...ORDER.map(c => [c, c, CATS[c]]),
  ].map(([id, label, color]) =>
    `<button type="button" data-cat="${id}" style="--cat:${color}" aria-pressed="${id === 'all'}">${label}</button>`
  ).join('');

  filters.addEventListener('click', e => {
    const btn = e.target.closest('button[data-cat]');
    if (!btn) return;
    active = btn.dataset.cat;
    for (const b of filters.querySelectorAll('button')) {
      b.setAttribute('aria-pressed', String(b.dataset.cat === active));
    }
    for (const section of catalog.querySelectorAll('.section')) {
      section.classList.toggle('hidden', active !== 'all' && section.dataset.cat !== active);
    }
  });

  catalog.innerHTML = ORDER.map(cat => {
    const defs = UPGRADES.filter(u => u.cat === cat);
    const blocks = defs.map(def => {
      const tiers = expandTiers(def);
      const cards = tiers.map(t => cardHtml(t)).join('');
      return `<div class="upgrade-block"><h3>${tiers[0].name} · ${tiers.length} panel${tiers.length === 1 ? '' : 's'}</h3><div class="grid">${cards}</div></div>`;
    }).join('');
    return `<section class="section" data-cat="${cat}" style="--cat:${CATS[cat]}"><h2>${cat}</h2>${blocks}</section>`;
  }).join('');

  const byId = (id, owned = 0) => ALL_CARDS.find(u => u.id === id && u.owned === owned) || ALL_CARDS.find(u => u.id === id);
  document.getElementById('trio').innerHTML = [
    cardHtml(byId('spread', 0), { recommended: true, key: '1' }),
    cardHtml(byId('bot', 0), { key: '2' }),
    cardHtml(byId('magnet', 0), { key: '3' }),
  ].join('');

  // —— shared WebGL → 2D canvas blit ——
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'low-power' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  renderer.domElement.style.cssText = 'position:fixed;left:-9999px;top:0;pointer-events:none;opacity:0';
  document.body.appendChild(renderer.domElement);

  const stages = [];
  const canvasNodes = [...document.querySelectorAll('.icon-stage')];
  canvasNodes.forEach((canvas, i) => {
    const card = canvas.closest('.card');
    const id = card.dataset.id;
    const owned = Number(card.dataset.owned || 0);
    const upgrade = byId(id, owned);
    const { scene, camera, root } = makeScene(upgrade);
    const ctx = canvas.getContext('2d');
    const baseYaw = -0.35 + (i % 5) * 0.08;
    const entry = {
      canvas, ctx, scene, camera, root, id,
      yaw: baseYaw,
      baseYaw,
      phase: i * 0.7,
      visible: false,
      dragging: false,
      lastX: 0,
      hot: false,
    };
    stages.push(entry);

    const setHot = on => { entry.hot = on; };
    card.addEventListener('pointerenter', () => setHot(true));
    card.addEventListener('pointerleave', () => { setHot(false); entry.dragging = false; });

    canvas.addEventListener('pointerdown', e => {
      entry.dragging = true;
      entry.lastX = e.clientX;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', e => {
      if (!entry.dragging) return;
      entry.yaw += (e.clientX - entry.lastX) * 0.01;
      entry.lastX = e.clientX;
    });
    const endDrag = () => {
      entry.dragging = false;
      // Resume sway around whatever angle the user left it.
      if (SWAY_IDS.has(id)) entry.baseYaw = entry.yaw;
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
  });

  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const stage = stages.find(s => s.canvas === e.target);
      if (stage) stage.visible = e.isIntersecting;
    }
  }, { rootMargin: '80px' });
  stages.forEach(s => io.observe(s.canvas));

  let t0 = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - t0) / 1000);
    t0 = now;
    const t = now / 1000;

    for (const entry of stages) {
      if (!entry.visible) continue;
      const { canvas, ctx, scene, camera, root } = entry;
      const w = canvas.clientWidth || 256;
      const h = canvas.clientHeight || 160;
      if (canvas.width !== w * renderer.getPixelRatio() || canvas.height !== h * renderer.getPixelRatio()) {
        const pr = renderer.getPixelRatio();
        canvas.width = Math.max(1, Math.floor(w * pr));
        canvas.height = Math.max(1, Math.floor(h * pr));
      }
      camera.aspect = w / Math.max(1, h);
      // Show the lower strip of a taller frustum so the diorama sits near the top.
      const topPad = Math.round(h * 0.28);
      camera.setViewOffset(w, h + topPad, 0, topPad, w, h);
      camera.updateProjectionMatrix();
      animateIcon(entry, t, dt, entry.hot || entry.dragging);
      renderer.setSize(w, h, false);
      renderer.render(scene, camera);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
